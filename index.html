<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Stack Harmony 3D 🌌</title>
  <meta name="description" content="Zen 3D block slicing & tower stacking game with soothing synthwave chords and glowing neon aesthetics.">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="arcade-leaderboard.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; user-select: none; }
    body {
      background: #080914;
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 600px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #151833 0%, #060710 100%);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .arcade-nav {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 100;
      background: rgba(10, 14, 30, 0.85);
      border: 2px solid #00f5ff;
      color: #00f5ff;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      font-size: 13px;
      box-shadow: 0 0 15px rgba(0,245,255,0.3);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .arcade-nav:hover {
      background: #00f5ff;
      color: #000;
      box-shadow: 0 0 25px #00f5ff;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 50;
      pointer-events: none;
    }
    .score-title {
      font-size: 13px;
      letter-spacing: 2px;
      color: #8e9bb0;
      font-weight: 600;
    }
    .score-val {
      font-size: 42px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px rgba(0, 245, 255, 0.6);
      line-height: 1;
      margin-top: 2px;
    }
    .combo-text {
      font-size: 16px;
      font-weight: 800;
      color: #ff007f;
      text-shadow: 0 0 12px #ff007f;
      height: 24px;
      margin-top: 4px;
      transition: transform 0.15s ease;
    }
    #start-hint {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 1px;
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      animation: pulse 2s infinite ease-in-out;
      white-space: nowrap;
      z-index: 50;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: translate(-50%, 0); }
      50% { opacity: 1; transform: translate(-50%, -6px); }
    }
    #gameover-modal {
      position: absolute;
      inset: 0;
      background: rgba(6, 7, 16, 0.88);
      backdrop-filter: blur(12px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 24px;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    #gameover-modal h1 {
      font-size: 34px;
      font-weight: 900;
      color: #ff007f;
      text-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
      margin-bottom: 12px;
    }
    .modal-stats {
      font-size: 18px;
      color: #c4d1eb;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .modal-stats span {
      color: #00f5ff;
      font-weight: 800;
      font-size: 22px;
    }
    .btn {
      background: linear-gradient(135deg, #00f5ff, #ff007f);
      border: none;
      color: #000;
      font-weight: 800;
      font-size: 16px;
      padding: 14px 32px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 245, 255, 0.4);
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 30px rgba(255, 0, 127, 0.5);
    }
    @media (max-width: 600px) {
      .score-val { font-size: 34px; }
      .arcade-nav { font-size: 11px; padding: 6px 12px; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <a href="https://marcuscaiado.github.io/marcus-arcade/" class="arcade-nav">🕹️ Arcade Hub</a>
    
    <div class="hud">
      <div class="score-title">TOWER HEIGHT</div>
      <div class="score-val" id="score-display">0</div>
      <div class="combo-text" id="combo-display"></div>
    </div>

    <div id="start-hint">TAP / CLICK / SPACE TO PLACE SLAB</div>

    <div id="gameover-modal">
      <h1>TOWER FALLEN! 💥</h1>
      <div class="modal-stats">
        HEIGHT: <span id="final-score">0</span> SLABS<br>
        BEST: <span id="best-score">0</span> SLABS
      </div>
      <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
        <button class="btn" id="restart-btn">STACK AGAIN 🔄</button>
        <a href="https://marcuscaiado.github.io/marcus-arcade/" class="btn" style="background:#151833; color:#00f5ff; border:1px solid #00f5ff;">ARCADE HUB 🕹️</a>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // HARMONIC PENTATONIC AUDIO SYNTHESIZER
    // ==========================================
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    // Pentatonic scale (C, D, E, G, A across octaves) for soothing musical feedback
    const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
    function playChordNote(combo) {
      try {
        const ctx = getAudio();
        const noteIndex = combo % scale.length;
        const freq = scale[noteIndex];
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = combo > 4 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch(e) {}
    }

    function playMissSound() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch(e) {}
    }

    // ==========================================
    // THREE.JS 3D SCENE SETUP
    // ==========================================
    const container = document.getElementById('game-container');
    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.OrthographicCamera(
      container.clientWidth / -40,
      container.clientWidth / 40,
      container.clientHeight / 40,
      container.clientHeight / -40,
      -100,
      1000
    );
    camera.position.set(40, 45, 40);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight.position.set(30, 60, 40);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // ==========================================
    // GAME STATE & MECHANICS
    // ==========================================
    const BOX_HEIGHT = 1.2;
    const INITIAL_WIDTH = 12;
    const INITIAL_DEPTH = 12;
    const SPEED = 0.16;

    let stack = [];
    let overhangs = [];
    let score = 0;
    let combo = 0;
    let bestScore = parseInt(localStorage.getItem('neon_stack_best') || '0', 10);
    let isGameOver = false;
    let gameStarted = false;
    let currentDirection = 'x'; // 'x' or 'z'
    let currentSpeed = SPEED;

    const scoreDisplay = document.getElementById('score-display');
    const comboDisplay = document.getElementById('combo-display');
    const startHint = document.getElementById('start-hint');
    const modal = document.getElementById('gameover-modal');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreEl = document.getElementById('best-score');

    function getColor(index) {
      const hue = (index * 14 + 180) % 360;
      return new THREE.Color(`hsl(${hue}, 85%, 60%)`);
    }

    function createBase() {
      const geometry = new THREE.BoxGeometry(INITIAL_WIDTH, BOX_HEIGHT * 3, INITIAL_DEPTH);
      const material = new THREE.MeshLambertMaterial({ color: getColor(0) });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(0, -BOX_HEIGHT * 1.5, 0);
      mesh.receiveShadow = true;
      scene.add(mesh);
      stack.push({
        mesh: mesh,
        width: INITIAL_WIDTH,
        depth: INITIAL_DEPTH,
        x: 0,
        z: 0,
        y: -BOX_HEIGHT * 1.5
      });
    }

    function spawnNextLayer() {
      const top = stack[stack.length - 1];
      const nextColor = getColor(stack.length);
      const geometry = new THREE.BoxGeometry(top.width, BOX_HEIGHT, top.depth);
      const material = new THREE.MeshLambertMaterial({ color: nextColor });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      currentDirection = stack.length % 2 === 1 ? 'x' : 'z';
      const offset = 18;
      const startPos = currentDirection === 'x' ? -offset : -offset;

      const layerY = (stack.length - 1) * BOX_HEIGHT;
      mesh.position.set(
        currentDirection === 'x' ? startPos : top.x,
        layerY,
        currentDirection === 'z' ? startPos : top.z
      );

      scene.add(mesh);
      return {
        mesh: mesh,
        width: top.width,
        depth: top.depth,
        x: mesh.position.x,
        z: mesh.position.z,
        y: layerY,
        dir: 1
      };
    }

    let activeLayer = null;

    function placeSlab() {
      if (isGameOver) return;
      getAudio();

      if (!gameStarted) {
        gameStarted = true;
        startHint.style.display = 'none';
        activeLayer = spawnNextLayer();
        return;
      }

      if (!activeLayer) return;

      const top = stack[stack.length - 1];
      const deltaX = activeLayer.mesh.position.x - top.x;
      const deltaZ = activeLayer.mesh.position.z - top.z;

      const delta = currentDirection === 'x' ? deltaX : deltaZ;
      const dimension = currentDirection === 'x' ? activeLayer.width : activeLayer.depth;
      const absDelta = Math.abs(delta);

      // 1. Check for Perfect Placement (within generous tolerance for satisfaction)
      const PERFECT_TOLERANCE = 0.35;
      if (absDelta < PERFECT_TOLERANCE) {
        combo++;
        activeLayer.mesh.position.x = top.x;
        activeLayer.mesh.position.z = top.z;
        playChordNote(combo);
        showComboText(`PERFECT! x${combo} ✨`);
      } else {
        combo = 0;
        showComboText('');
        playChordNote(0);

        // 2. Check for Complete Miss (Game Over)
        if (absDelta >= dimension) {
          endGame();
          return;
        }

        // 3. Slice and cut overhang
        const newSize = dimension - absDelta;
        const overhangSize = absDelta;
        const currentY = activeLayer.mesh.position.y;
        const layerColor = activeLayer.mesh.material.color;

        // Resize placed slab
        scene.remove(activeLayer.mesh);
        activeLayer.mesh.geometry.dispose();

        const newW = currentDirection === 'x' ? newSize : activeLayer.width;
        const newD = currentDirection === 'z' ? newSize : activeLayer.depth;
        const newX = currentDirection === 'x' ? top.x + delta / 2 : activeLayer.mesh.position.x;
        const newZ = currentDirection === 'z' ? top.z + delta / 2 : activeLayer.mesh.position.z;

        const newGeo = new THREE.BoxGeometry(newW, BOX_HEIGHT, newD);
        const newMesh = new THREE.Mesh(newGeo, new THREE.MeshLambertMaterial({ color: layerColor }));
        newMesh.position.set(newX, currentY, newZ);
        newMesh.castShadow = true;
        newMesh.receiveShadow = true;
        scene.add(newMesh);

        activeLayer.mesh = newMesh;
        activeLayer.width = newW;
        activeLayer.depth = newD;
        activeLayer.x = newX;
        activeLayer.z = newZ;

        // Create dropping overhang piece
        const overW = currentDirection === 'x' ? overhangSize : activeLayer.width;
        const overD = currentDirection === 'z' ? overhangSize : activeLayer.depth;
        const overX = currentDirection === 'x' ? (delta > 0 ? newX + newSize / 2 + overhangSize / 2 : newX - newSize / 2 - overhangSize / 2) : newX;
        const overZ = currentDirection === 'z' ? (delta > 0 ? newZ + newSize / 2 + overhangSize / 2 : newZ - newSize / 2 - overhangSize / 2) : newZ;

        const overGeo = new THREE.BoxGeometry(overW, BOX_HEIGHT, overD);
        const overMesh = new THREE.Mesh(overGeo, new THREE.MeshLambertMaterial({ color: layerColor, transparent: true, opacity: 0.9 }));
        overMesh.position.set(overX, currentY, overZ);
        scene.add(overMesh);

        overhangs.push({
          mesh: overMesh,
          vy: 0,
          rotX: (Math.random() - 0.5) * 0.1,
          rotZ: (Math.random() - 0.5) * 0.1
        });
      }

      stack.push({
        mesh: activeLayer.mesh,
        width: activeLayer.width,
        depth: activeLayer.depth,
        x: activeLayer.mesh.position.x,
        z: activeLayer.mesh.position.z,
        y: activeLayer.mesh.position.y
      });

      score++;
      scoreDisplay.textContent = score;

      // Camera elevation target
      targetCamY = 45 + score * BOX_HEIGHT;

      activeLayer = spawnNextLayer();
    }

    function showComboText(txt) {
      comboDisplay.textContent = txt;
      comboDisplay.style.transform = 'scale(1.2)';
      setTimeout(() => comboDisplay.style.transform = 'scale(1)', 150);
    }

    function endGame() {
      isGameOver = true;
      playMissSound();
      if (activeLayer) {
        overhangs.push({
          mesh: activeLayer.mesh,
          vy: 0,
          rotX: 0.05,
          rotZ: 0.05
        });
        activeLayer = null;
      }
      bestScore = Math.max(bestScore, score);
      localStorage.setItem('neon_stack_best', bestScore);
      finalScoreEl.textContent = score;
      bestScoreEl.textContent = bestScore;

      if (window.ArcadeLeaderboard) {
        window.ArcadeLeaderboard.show({
          gameId: 'neon-stack-3d',
          score: score,
          scoreUnit: 'SLABS',
          onRestart: resetGame
        });
      } else {
        modal.style.display = 'flex';
      }
    }

    function resetGame() {
      // Clear 3D items
      for (const item of stack) scene.remove(item.mesh);
      for (const over of overhangs) scene.remove(over.mesh);
      if (activeLayer) scene.remove(activeLayer.mesh);

      stack = [];
      overhangs = [];
      score = 0;
      combo = 0;
      isGameOver = false;
      gameStarted = false;
      scoreDisplay.textContent = '0';
      comboDisplay.textContent = '';
      startHint.style.display = 'block';
      modal.style.display = 'none';

      createBase();
      targetCamY = 45;
      camera.position.set(40, 45, 40);
      camera.lookAt(0, 0, 0);
    }

    // ==========================================
    // INPUT HANDLERS
    // ==========================================
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.arcade-nav, #gameover-modal, button')) return;
      placeSlab();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        placeSlab();
      }
    });

    document.getElementById('restart-btn').addEventListener('click', resetGame);

    // ==========================================
    // ANIMATION & GAME LOOP
    // ==========================================
    let targetCamY = 45;

    function animate() {
      requestAnimationFrame(animate);

      // Smooth camera pan upwards
      camera.position.y += (targetCamY - camera.position.y) * 0.08;
      const targetLookY = (targetCamY - 45);
      camera.lookAt(0, targetLookY, 0);

      // Move active sliding layer
      if (activeLayer && !isGameOver) {
        const speed = currentSpeed;
        if (currentDirection === 'x') {
          activeLayer.mesh.position.x += speed * activeLayer.dir;
          if (activeLayer.mesh.position.x > 18) activeLayer.dir = -1;
          if (activeLayer.mesh.position.x < -18) activeLayer.dir = 1;
        } else {
          activeLayer.mesh.position.z += speed * activeLayer.dir;
          if (activeLayer.mesh.position.z > 18) activeLayer.dir = -1;
          if (activeLayer.mesh.position.z < -18) activeLayer.dir = 1;
        }
      }

      // Animate falling sliced overhangs
      for (let i = overhangs.length - 1; i >= 0; i--) {
        const item = overhangs[i];
        item.vy -= 0.05;
        item.mesh.position.y += item.vy;
        item.mesh.rotation.x += item.rotX;
        item.mesh.rotation.z += item.rotZ;
        item.mesh.material.opacity *= 0.97;

        if (item.mesh.position.y < -30 || item.mesh.material.opacity < 0.05) {
          scene.remove(item.mesh);
          overhangs.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    // Resize Handler
    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.left = w / -40;
      camera.right = w / 40;
      camera.top = h / 40;
      camera.bottom = h / -40;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    createBase();
    animate();
  </script>
</body>
</html>
